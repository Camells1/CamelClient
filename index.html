<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src https:" />
  <title>Camel Client</title>
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <!-- Top bar (the window has no frame of its own) -->
  <header id="bar">
    <div class="brand"><img src="assets/games/camel.svg" alt="" /><b>CAMEL</b><span>CLIENT</span></div>
    <nav id="tabs" class="hidden">
      <button data-nav="home">Home</button>
      <button data-nav="library">Library</button>
    </nav>
    <div class="drag"></div>
    <button id="update" class="hidden" title="Install the new version and restart"></button>
    <button id="chip" class="hidden" data-nav="settings" title="Account and settings"><i class="avatar" id="chip-avatar"></i><span id="chip-name"></span></button>
    <div class="win-btns">
      <button data-win="min" title="Minimise"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
      <button data-win="max" title="Maximise"><svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7"/></svg></button>
      <button data-win="close" class="close" title="Close"><svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg></button>
    </div>
  </header>

  <!-- Sign in -->
  <section id="login" class="hidden">
    <div class="login-art" id="login-art"><div class="art-caption"><small>NOW PLAYING</small><b id="art-name"></b><span id="art-tag"></span></div></div>
    <div class="login-panel">
      <h1 id="login-title">Welcome back</h1>
      <p class="login-sub" id="login-sub">Sign in to your Camel Studios account.</p>
      <form id="f-in" autocomplete="on">
        <label>Email<input id="in-email" type="email" autocomplete="username" required /></label>
        <label>Password<input id="in-pass" type="password" autocomplete="current-password" required /></label>
        <label class="check"><input id="in-stay" type="checkbox" checked /> Stay signed in</label>
        <button class="go" type="submit">Sign in</button>
        <div class="login-links"><a id="l-reset">Forgot password?</a><a id="l-up">Create account</a></div>
      </form>
      <form id="f-up" class="hidden" autocomplete="off">
        <label>Email<input id="up-email" type="email" required /></label>
        <label>Password<input id="up-pass" type="password" minlength="6" required /></label>
        <div class="id-row">
          <label>Name<input id="up-name" maxlength="14" required /></label>
          <label class="tag">Tag<input id="up-tag" maxlength="5" /></label>
        </div>
        <p class="hint">Your ID will be <b id="up-preview">Name#TAG</b>. Friends add you with it.</p>
        <button class="go" type="submit">Create account</button>
        <div class="login-links"><a id="l-in">I already have an account</a></div>
      </form>
      <p id="login-msg"></p>
      <div class="login-foot">One account for every Camel Studios game.</div>
    </div>
  </section>

  <!-- The client -->
  <div id="app" class="hidden">
    <nav id="dock"><div id="dock-games"></div><div class="dock-fill"></div>
      <button class="dock-btn" data-act="social" title="Friends"><svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="3.5"/><path d="M2.5 19c1-3.5 3.5-5 6.500-5s5.500 1.500 6.500 5M17 8a3 3 0 010 6"/></svg><i id="dock-count"></i></button>
      <button class="dock-btn" data-nav="settings" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.100 2.100M16.300 16.300l2.100 2.100M5.6 18.400l2.100-2.100M16.300 7.700l2.100-2.100"/></svg></button>
    </nav>
    <main id="view"></main>
    <aside id="social">
      <div class="tabs" id="social-tabs">
        <button data-tab="friends">Friends<i id="b-friends"></i></button>
        <button data-tab="party">Party<i id="b-party"></i></button>
        <button data-tab="add">Add</button>
      </div>
      <div id="social-body"></div>
    </aside>
  </div>

  <div id="toast"></div>
  <script type="module" src="src/app.js"></script>
</body>
</html>
